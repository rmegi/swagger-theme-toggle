[project]
name = "swagger-theme-toggle"
version = "0.1.1"
description = "Light / dark / system theme toggle for FastAPI's Swagger UI docs page"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Roy Megidish", email = "roy.megidish@gmail.com" }
]
keywords = ["fastapi", "swagger", "swagger-ui", "openapi", "dark-mode", "theme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.51.0",
]
